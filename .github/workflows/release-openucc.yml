name: Release OpenUCC

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например 0.1.0 или 0.1.0-rc.1)'
        required: true
        type: string
      prerelease:
        description: 'Опубликовать как предварительный релиз'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-openucc-${{ inputs.version }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate identity and reject existing tags or releases
        id: identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys, urllib.error, urllib.request
          sys.path.insert(0, 'tools')
          from package_portable import validate_identity
          version = os.environ['RELEASE_VERSION']
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          validate_identity(version, revision)
          if '-' in version and os.environ['IS_PRERELEASE'] != 'true':
              raise ValueError('A version with a prerelease suffix must be marked prerelease')
          tag = 'openucc-v' + version
          base = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY']
          for route in ('/releases/tags/', '/git/ref/tags/'):
              request = urllib.request.Request(base + route + tag, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30):
                      raise ValueError('Release or tag already exists: ' + tag)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('revision=' + revision + '\n')
          PY

  build:
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Configure Windows x64
        run: cmake -S . -B build-release -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build-release --config Release --parallel 2
      - run: ctest --test-dir build-release -C Release --output-on-failure
      - name: Test Python tools
        run: |
          New-Item -ItemType Directory -Path local -Force | Out-Null
          python -B -m unittest discover -s tests -p "test_*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package and test the extracted archive
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REVISION: ${{ needs.preflight.outputs.revision }}
        run: |
          if (git status --porcelain) { throw 'Source checkout is not clean' }
          python -B tools/package_portable.py --version $env:RELEASE_VERSION --revision $env:RELEASE_REVISION --exe build-release/Release/openucc.exe --fixture-tool build-release/Release/openucc_portable_fixture.exe --out "$env:RUNNER_TEMP/openucc-release"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: openucc-release
          path: ${{ runner.temp }}/openucc-release/publish/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: openucc-release
          path: release
      - name: Publish verified ZIP
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REVISION: ${{ needs.preflight.outputs.revision }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          tag="openucc-v${RELEASE_VERSION}"
          flags=()
          latest=true
          if [[ "$IS_PRERELEASE" == true ]]; then
            flags+=(--prerelease)
            latest=false
          fi
          # Create the tag atomically: never publish against a tag created by a race.
          gh api "repos/${GH_REPO}/git/refs" --method POST \
            -f "ref=refs/tags/${tag}" -f "sha=${RELEASE_REVISION}" > /dev/null
          gh release create "$tag" "OpenUCC-${RELEASE_VERSION}-windows-x64.zip" SHA256SUMS.txt \
            --verify-tag --title "openUCC ${RELEASE_VERSION}" \
            --notes-file RELEASE_NOTES.md --draft "${flags[@]}"
          gh release edit "$tag" --draft=false --latest="$latest"
          echo "Published: https://github.com/${GH_REPO}/releases/tag/${tag}" >> "$GITHUB_STEP_SUMMARY"
